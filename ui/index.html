<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tally</title>
    <meta name="description" content="Tally: escrowed B2B deals on Cardano with evidence rules, tiered disputes, and a reliability record." />
    <script>
      // Apply the theme before styles load to avoid a flash of the wrong theme.
      let savedTheme
      try { savedTheme = localStorage.getItem("tally-theme") ?? localStorage.getItem("reliability-theme") } catch {}
      document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark"
        ? savedTheme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <p class="loading" role="status">Loading Tally…</p>
    </div>
    <noscript>This read-only Tally display requires JavaScript.</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
